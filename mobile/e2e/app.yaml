# End-to-end: the real app in Expo Go on the iOS simulator, talking to a real fshare CLI on this Mac.
# The simulator shares the Mac's localhost, so the app sees the CLI exactly as it would over a USB cable.
# Run with: npm run e2e (from the repo root). See run.sh.
appId: host.exp.Exponent
---
- stopApp
- openLink: ${APP_URL}

# first launch: onboarding
- extendedWaitUntil:
    visible: Send files between your phone and laptop
    timeout: 90000
- tapOn: Next
- assertVisible: Plug in
- assertVisible: npx fshare-cli, copy
- tapOn: Next
- assertVisible: No cable\? Use Wi-Fi
- tapOn: Get started

# connects to the CLI by itself and lists what it shares
- extendedWaitUntil:
    visible: Ready to download
    timeout: 20000
- assertVisible: .*connected over USB cable
- assertVisible: Download hello\.txt
- assertVisible: photos, 2 files.*

# select mode: long press, select all, deselect, leave
- longPressOn: Download hello\.txt
- assertVisible: 1 selected
- tapOn: Select all
- assertVisible: 3 selected
- tapOn: Deselect all
- assertVisible: 0 selected
- tapOn: Done
- assertVisible: Ready to download

# download everything
- tapOn: Get all
- extendedWaitUntil:
    visible: Transfers
    timeout: 30000
- extendedWaitUntil:
    visible: .*Saved to Files.*
    timeout: 30000

# remove the folder from the list (the CLI unshares it; files on the Mac stay)
- tapOn: Select
- tapOn: photos # in select mode the row is just its name
- assertVisible: 2 selected
- tapOn: Remove
- extendedWaitUntil:
    notVisible: photos.*
    timeout: 5000

# settings and about
- tapOn: Settings
- assertVisible: Appearance
- tapOn: About.*
- assertVisible: Version.*
- assertVisible: Connected over
- tapOn: Back
- assertVisible: Ready to download
