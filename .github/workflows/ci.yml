# Runs once per pull request. Not again on merge: branch protection only lets a PR into main when
# it's up to date with main and these jobs passed, so main is exactly what was just tested.
# (Run it by hand from the Actions tab if ever needed.) The APK isn't built here (10+ minutes per
# run); build it on your Mac with `npm run apk` (see README).
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
            mobile/package-lock.json
      - run: npm run setup
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Expo doctor
        run: npx expo-doctor
        working-directory: mobile

  cli:
    name: CLI on Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: install.sh installs it from git, and it uninstalls
        working-directory: .
        env:
          FSHARE_HOME: ${{ runner.temp }}/fshare
          FSHARE_BIN: ${{ runner.temp }}/bin
        run: |
          git switch -c ci-install # install.sh clones a branch; CI checks out a commit
          FSHARE_REPO="$PWD" FSHARE_REF=ci-install sh install.sh
          "$FSHARE_BIN/fshare" --help | grep -q "fast file transfer"
          "$FSHARE_BIN/fshare" uninstall
          test ! -e "$FSHARE_BIN/fshare" && test ! -e "$FSHARE_HOME"

  cli-oldest-node:
    # the installed CLI is plain JS and must run on Node 20; the tests themselves need 22+
    name: CLI runs on Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci && npm run build
        working-directory: cli
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node cli/dist/fshare.js --help | grep -q "fast file transfer"
