# CLI releases: `npm run release:publish -- cli` pushes a cli-v1.2.3 tag, and this tests it and
# creates the GitHub release. The CLI isn't on npm: people install it from GitHub with install.sh.
# (APK releases are built and uploaded from your Mac by the same script, so there's no app job here.)
name: Release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write

jobs:
  cli:
    if: startsWith(github.ref_name, 'cli-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag matches package.json
        run: test "cli-v$(node -p 'require("./package.json").version')" = "${{ github.ref_name }}"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: GitHub release
        # not "latest": that's the app's release, so the README's APK link (releases/latest) keeps working
        run: gh release create "${{ github.ref_name }}" --title "CLI ${GITHUB_REF_NAME#cli-}" --generate-notes --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
