# CLI releases: `npm run release:publish -- cli` pushes a cli-v1.2.3 tag, and this publishes
# fshare-cli@1.2.3 to npm and creates the GitHub release. (APK releases are built and uploaded
# from your Mac by the same script, so there's no app job here.)
name: Release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write

jobs:
  cli:
    if: startsWith(github.ref_name, 'cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: test "cli-v$(node -p 'require("./package.json").version')" = "${{ github.ref_name }}"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "${{ github.ref_name }}" --title "CLI ${GITHUB_REF_NAME#cli-}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
